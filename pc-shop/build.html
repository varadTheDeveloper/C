<!doctype html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Build my PC | Computer Warehouse Jalna</title>
  <meta name="description" content="Tell Computer Warehouse Jalna your budget and use. We suggest the right parts and send today's price on WhatsApp.">
  <meta name="theme-color" content="#2A6BE6">
  <link rel="preload" href="assets/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/noto-sans-devanagari-devanagari-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="build">
  <a class="skip" href="#main" data-i18n="skip"></a>
  <div data-layout="header"></div>

  <main id="main" class="form-page">
    <div class="wrap form-wrap">
      <div class="form-hero">
        <div>
          <h1 data-i18n="bp_title"></h1>
          <p data-i18n="bp_intro"></p>
        </div>
        <span class="form-hero-art"><img src="assets/products/msi-mag-forge-100r.jpg" alt=""></span>
      </div>

      <form class="form-card" id="build-form" novalidate>
        <p class="form-error" id="build-error" role="alert" hidden></p>
        <fieldset class="q">
          <legend data-i18n="bp_use"></legend>
          <div class="opts">
            <label class="opt"><input type="checkbox" name="use" value="use_gaming"><span data-i18n="use_gaming"></span></label>
            <label class="opt"><input type="checkbox" name="use" value="use_office"><span data-i18n="use_office"></span></label>
            <label class="opt"><input type="checkbox" name="use" value="use_trading"><span data-i18n="use_trading"></span></label>
            <label class="opt"><input type="checkbox" name="use" value="use_editing"><span data-i18n="use_editing"></span></label>
            <label class="opt"><input type="checkbox" name="use" value="use_other"><span data-i18n="use_other"></span></label>
          </div>
        </fieldset>
        <fieldset class="q">
          <legend data-i18n="bp_budget"></legend>
          <div class="opts">
            <label class="opt"><input type="radio" name="budget" value="budget_1"><span data-i18n="budget_1"></span></label>
            <label class="opt"><input type="radio" name="budget" value="budget_2"><span data-i18n="budget_2"></span></label>
            <label class="opt"><input type="radio" name="budget" value="budget_3"><span data-i18n="budget_3"></span></label>
            <label class="opt"><input type="radio" name="budget" value="budget_4"><span data-i18n="budget_4"></span></label>
            <label class="opt"><input type="radio" name="budget" value="budget_5"><span data-i18n="budget_5"></span></label>
          </div>
        </fieldset>
        <fieldset class="q">
          <legend data-i18n="bp_pref"></legend>
          <div class="opts">
            <label class="opt"><input type="radio" name="cpu" value="pref_any" checked><span data-i18n="pref_any"></span></label>
            <label class="opt"><input type="radio" name="cpu" value="cpu_intel"><span>Intel</span></label>
            <label class="opt"><input type="radio" name="cpu" value="cpu_amd"><span>AMD Ryzen</span></label>
          </div>
        </fieldset>
        <fieldset class="q">
          <legend data-i18n="bp_extras"></legend>
          <div class="opts">
            <label class="opt"><input type="checkbox" name="extras" value="ex_monitor"><span data-i18n="ex_monitor"></span></label>
            <label class="opt"><input type="checkbox" name="extras" value="ex_kbm"><span data-i18n="ex_kbm"></span></label>
            <label class="opt"><input type="checkbox" name="extras" value="ex_ups"><span data-i18n="ex_ups"></span></label>
            <label class="opt"><input type="checkbox" name="extras" value="ex_wifi"><span data-i18n="ex_wifi"></span></label>
            <label class="opt"><input type="checkbox" name="extras" value="ex_speakers"><span data-i18n="ex_speakers"></span></label>
          </div>
        </fieldset>
        <fieldset class="q">
            <legend data-i18n="q_how"></legend>
            <div class="opts">
            <label class="opt"><input type="radio" name="how" value="pickup" checked><span data-i18n="q_pickup"></span></label>
            <label class="opt"><input type="radio" name="how" value="jalna"><span data-i18n="q_jalna"></span></label>
            <label class="opt"><input type="radio" name="how" value="other"><span data-i18n="q_other"></span></label>
            </div>
          </fieldset>
        <div class="form-fields">
          <label class="field" data-place><span data-i18n="q_place"></span><input name="place" autocomplete="address-level2"></label>
          <label class="field"><span data-i18n="q_name"></span><input name="name" autocomplete="name"></label>
          <label class="field"><span data-i18n="q_note"></span><textarea name="note" rows="2"></textarea></label>
        </div>
        <div class="form-submit">
          <button type="submit" class="btn btn-wa btn-block"><span data-icon="whatsapp"></span><span data-i18n="bp_send"></span></button>
        </div>
      </form>
    </div>
    <div id="build-rail"></div>
  </main>

  <div data-layout="footer"></div>
  <div data-layout="bottom"></div>
  <div data-layout="quote"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="data/sample-products.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/quote.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
