<!doctype html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Computer Warehouse Jalna | लॅपटॉप, कॉम्प्युटर, प्रिंटर</title>
  <meta name="description" content="Computer Warehouse Jalna: laptops, complete computer setups, printers, PC parts and repair at Shani Mandir Chowk, Old Jalna. Get today's price on WhatsApp.">
  <meta name="theme-color" content="#2A6BE6">
  <link rel="preload" href="assets/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/noto-sans-devanagari-devanagari-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
  <a class="skip" href="#main" data-i18n="skip">मुख्य मजकुराकडे जा</a>

  <div data-layout="header"></div>

  <main id="main">
    <section class="cat-row" aria-labelledby="cat-title">
      <div class="wrap">
        <h2 class="sr-only" id="cat-title" data-i18n="cat_title">काय हवे आहे?</h2>
        <ul class="cats" id="categories"></ul>
      </div>
    </section>

    <section class="banners" aria-label="Offers">
      <div class="wrap">
        <div class="slider" id="slider">
          <div class="slides" id="slides" tabindex="0">
            <article class="slide slide-offer" id="offer">
              <div class="slide-copy">
                <p class="slide-tag" data-i18n="badge_offer">ऑफर</p>
                <h2 class="slide-title" data-i18n="offer_title"></h2>
                <p class="slide-text" data-i18n="b1_b"></p>
                <a class="btn btn-yellow" data-wa="wa_offer" href="#" data-i18n="offer_btn"></a>
              </div>
              <div class="slide-photo"><img src="assets/products/canon-pixma-g3012.jpg" alt="" data-fallback="printers"></div>
            </article>
            <article class="slide slide-build">
              <div class="slide-copy">
                <h2 class="slide-title" data-i18n="b2_t"></h2>
                <p class="slide-text" data-i18n="b2_b"></p>
                <a class="btn btn-yellow" href="build.html" data-i18n="build_btn"></a>
              </div>
              <div class="slide-photo"><img src="assets/products/rtx-5060.jpg" alt="" data-fallback="pc-setups"></div>
            </article>
            <article class="slide slide-repair">
              <div class="slide-copy">
                <h2 class="slide-title" data-i18n="repair_t"></h2>
                <p class="slide-text" data-i18n="repair_b"></p>
                <a class="btn" href="repair.html" data-i18n="repair_btn"></a>
              </div>
              <div class="slide-art" data-art="repair" data-seed="repair-c"></div>
            </article>
          </div>
          <button type="button" class="slider-arrow slider-prev" data-slide="-1" aria-label="Previous"><span data-icon="chevron-left"></span></button>
          <button type="button" class="slider-arrow slider-next" data-slide="1" aria-label="Next"><span data-icon="chevron-right"></span></button>
          <div class="dots" id="dots" role="tablist" aria-label="Slides"></div>
        </div>
      </div>
    </section>

    <section class="trust" aria-label="Why buy here">
      <div class="wrap">
        <ul class="trust-list">
          <li><a data-place-link href="#" target="_blank" rel="noopener"><span class="trust-icon trust-star" data-icon="star"></span><span data-rating></span></a></li>
          <li><span class="trust-icon" data-icon="clock"></span><span data-i18n="hours_v"></span></li>
          <li><span class="trust-icon" data-icon="truck"></span><span data-i18n="trust_delivery"></span></li>
          <li><span class="trust-icon" data-icon="shield"></span><span data-i18n="trust_pay"></span></li>
        </ul>
      </div>
    </section>

    <div id="rails"></div>

    <section class="section how" id="how">
      <div class="wrap"><div class="how-inner">
        <h2 class="h2" data-i18n="how_title">खरेदी कशी करायची</h2>
        <ol class="steps">
          <li><span class="step-icon" data-icon="quote"></span><div><h3 data-i18n="step1_t"></h3><p data-i18n="step1_b"></p></div></li>
          <li><span class="step-icon step-wa" data-icon="whatsapp"></span><div><h3 data-i18n="step2_t"></h3><p data-i18n="step2_b"></p></div></li>
          <li><span class="step-icon" data-icon="upi"></span><div><h3 data-i18n="step3_t"></h3><p data-i18n="step3_b"></p></div></li>
        </ol>
      </div></div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="bulk">
          <div>
            <h2 class="bulk-title" data-i18n="bulk_t"></h2>
            <p data-i18n="bulk_b"></p>
          </div>
          <a class="btn btn-wa" data-wa="wa_bulk" href="#"><span data-icon="whatsapp"></span><span data-i18n="bulk_btn"></span></a>
        </div>
      </div>
    </section>

    <section class="section brands-section" aria-labelledby="brands-title">
      <div class="wrap"><div class="brands-box">
        <h2 class="h2" id="brands-title" data-i18n="brands_t"></h2>
        <ul class="brands" id="brands"></ul>
      </div></div>
    </section>

    <section class="section visit" id="visit">
      <div class="wrap">
        <div class="visit-card">
          <div class="visit-info">
            <h2 class="h2" data-i18n="visit_title">दुकानात या</h2>
            <dl class="facts">
              <div><dt><span data-icon="pin" data-size="20"></span><span class="sr-only">Address</span></dt><dd data-i18n="address"></dd></div>
              <div><dt><span data-icon="clock" data-size="20"></span><span class="sr-only" data-i18n="hours_t"></span></dt><dd data-i18n="hours_v"></dd></div>
              <div><dt><span data-icon="phone" data-size="20"></span><span class="sr-only" data-i18n="phone_t"></span></dt><dd><ul class="phones" id="phones"></ul></dd></div>
            </dl>
            <div class="visit-actions">
              <a class="btn" data-directions href="#" target="_blank" rel="noopener" data-i18n="directions">रस्ता दाखवा</a>
              <a class="btn btn-ghost" data-place-link href="#" target="_blank" rel="noopener"><span class="trust-star" data-icon="star" data-size="18"></span><span data-i18n="reviews_link"></span></a>
            </div>
          </div>
          <div class="visit-map">
            <iframe data-map title="Map: Computer Warehouse Jalna" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-layout="footer"></div>
  <div data-layout="bottom"></div>
  <div data-layout="quote"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="data/sample-products.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/quote.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
